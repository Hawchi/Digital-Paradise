<template id="event-card-template">
    <article class="event-card">
        <div class="sides-wrapper">
            <div class="page left">
                <div class="event-cover-image">
                    <div class="event-cover-image-outer-circle"></div>
                    <div class="event-cover-image-inner-circle"></div>
                    <div class="event-cover-image-dot"></div>
                </div>
            </div>

            <div class="page right">
                <div class="front-inner">
                    <div>
                        <img class="age-restriction" alt="18+">
                        <p class="event-title"></p>
                    </div>

                    <div>
                        <img class="icon-calendar">
                        <p class="event-date"></p>
                    </div>
                    <div>
                        <img class="icon-clock">
                        <p class="event-time"></p>
                    </div>

                    <div>
                        <img class="icon-location">
                        <p class="event-location"></p>
                    </div>

                    <div>
                        <img class="icon-vibe">
                        <p class="event-vibe"></p>
                    </div>
                    
                    <div>
                        <img class="icon-music">
                        <p class="event-music-style"></p>
                    </div>
                </div>
            </div>

            <div class="cover">
                <div class="front-cover">
                    <div class="front-cover-inner">
                        <div class="event-title"></div>
                        <div class="event-location"></div>
                    </div>
                </div>
            </div>
        </div>
    </article>
</template>
